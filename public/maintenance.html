<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#1a1f2a" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Application Update in Progress — AnyTime Diesel Workforce</title>
    <link rel="icon" href="/atd-favicon.png" type="image/png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f5f7;
        --card: #ffffff;
        --fg: #1a1f2a;
        --muted: #5c6570;
        --primary: #c62828;
        --border: rgba(26, 31, 42, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12151c;
          --card: #1a1f2a;
          --fg: #f3f4f6;
          --muted: #a0a8b4;
          --border: rgba(255, 255, 255, 0.12);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          "Plus Jakarta Sans",
          "Manrope",
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
          max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      }
      main {
        width: min(100%, 26rem);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1.75rem 1.5rem;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      }
      img {
        width: 3.25rem;
        height: 3.25rem;
        object-fit: contain;
        margin: 0 auto 1rem;
        display: block;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        line-height: 1.3;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0.75rem 0 0;
        font-size: 0.95rem;
        line-height: 1.45;
        color: var(--muted);
      }
      .thanks {
        margin-top: 0.5rem;
        font-size: 0.85rem;
      }
      button {
        margin-top: 1.35rem;
        width: 100%;
        min-height: 2.75rem;
        border: 0;
        border-radius: 0.65rem;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 3px;
      }
      .brand {
        margin-top: 1.25rem;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main role="main" aria-labelledby="maintenance-title">
      <img src="/atd-app-icon.png" alt="" width="52" height="52" />
      <h1 id="maintenance-title">Application Update in Progress</h1>
      <p>
        The application is being updated by the developer.<br />
        Please try again after 5–10 minutes.
      </p>
      <p class="thanks">Thank you for your patience.</p>
      <button type="button" id="try-again">Try Again</button>
      <p class="brand">AnyTime Diesel Workforce</p>
    </main>
    <script>
      (function () {
        var btn = document.getElementById("try-again");
        if (!btn) return;
        btn.addEventListener("click", function () {
          btn.disabled = true;
          btn.textContent = "Checking…";
          var urls = ["/api/maintenance/status", "/api/health", "/health"];
          function done(ok) {
            if (ok) {
              window.location.replace("/" + (window.location.search || "") + (window.location.hash || ""));
              return;
            }
            btn.disabled = false;
            btn.textContent = "Try Again";
          }
          function check(i) {
            if (i >= urls.length) {
              done(false);
              return;
            }
            fetch(urls[i], { credentials: "include", cache: "no-store" })
              .then(function (r) {
                if (!r.ok) throw new Error("not ok");
                return r.json().catch(function () {
                  return {};
                });
              })
              .then(function (body) {
                if (body && body.maintenance === true) {
                  done(false);
                  return;
                }
                if (body && body.ok === true) {
                  done(true);
                  return;
                }
                if (body && body.maintenance === false) {
                  done(true);
                  return;
                }
                check(i + 1);
              })
              .catch(function () {
                check(i + 1);
              });
          }
          check(0);
        });
      })();
    </script>
  </body>
</html>

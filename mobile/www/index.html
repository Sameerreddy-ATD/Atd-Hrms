<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light" />
    <title>AnyTime Diesel Workforce</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, Segoe UI, sans-serif;
        background: linear-gradient(180deg, #fff5f4 0%, #f6f8fc 45%, #f6f8fc 100%);
        color: #1a1f2c;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        text-align: center;
      }
      .mark {
        width: 4.5rem;
        height: 0.35rem;
        margin: 0 auto 1.25rem;
        border-radius: 999px;
        background: #dc2f20;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.45rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 auto 1.25rem;
        max-width: 22rem;
        line-height: 1.5;
        color: #5b6475;
        font-size: 0.95rem;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0 1.15rem;
        border-radius: 0.65rem;
        background: #dc2f20;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a.secondary {
        display: inline-block;
        margin-top: 0.85rem;
        color: #dc2f20;
        font-weight: 600;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>AnyTime Diesel Workforce</h1>
      <p>
        You are offline or the company server is unreachable. Reconnect to mobile data or Wi‑Fi, then
        open the app again to continue attendance, leave, and work tools.
      </p>
      <a class="button" href="https://hrms.anytime-diesel.com/login">Retry connection</a>
      <br />
      <a class="secondary" href="https://hrms.anytime-diesel.com/privacy">Privacy policy</a>
    </main>
    <script>
      window.addEventListener("online", function () {
        window.location.replace("https://hrms.anytime-diesel.com/login");
      });
    </script>
  </body>
</html>
